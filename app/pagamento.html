<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento — For School</title>
<link rel="icon" href="/assets/forschool.ico">
<meta property="og:title" content="Pagamento — Play Up Fotografia">
<meta property="og:description" content="Confira os dados do seu pedido e pague com Pix ou cartão, com segurança.">
<meta property="og:image" content="https://forschool.playupfotografia.com.br/assets/logo-playup.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#4B6BFB;--blue-light:#EEF1FF;
  --green:#27AE60;--green-light:#E9F7EF;
  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;
  --gray-400:#9CA3AF;--gray-500:#6B7280;--gray-700:#374151;--gray-900:#111827;
  --white:#fff;
}
body{font-family:'DM Sans',sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh;padding:20px 14px}
.wrap{max-width:440px;margin:0 auto}
.logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.logos img{height:38px}
.card{background:var(--white);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:22px;margin-bottom:16px}
.titulo{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:18px}
.linha{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.linha:last-child{border-bottom:none}
.linha b{color:var(--gray-900);text-align:right}
.linha span:first-child{color:var(--gray-500)}
.itens-lista{font-size:13px;color:var(--gray-700);margin-top:2px}
.valor-box{text-align:center;margin:18px 0 6px}
.valor-box .rotulo{font-size:12px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px}
.valor-box .num{font-size:34px;font-weight:800;color:var(--blue)}
.pago-box{background:var(--green-light);color:#065F46;border-radius:12px;padding:20px;text-align:center;font-weight:700;font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:10px;border:2px solid var(--gray-200);background:var(--white);font-weight:700;font-size:14px;cursor:pointer;text-align:center;color:var(--gray-500)}
.tab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.pane{display:none}
.pane.active{display:block}
.qr-wrap{display:flex;justify-content:center;margin:14px 0}
.qr-wrap canvas{border-radius:10px;border:1px solid var(--gray-200)}
.copia-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--gray-500);word-break:break-all;margin-bottom:10px;font-family:monospace}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
.btn-copiar{background:var(--gray-900);color:#fff;margin-bottom:8px}
.btn-cartao{background:var(--blue);color:#fff}
.nome-titular{font-size:12px;color:var(--gray-500);text-align:center;margin-top:10px;line-height:1.5}
.duvida{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--gray-500);text-decoration:none}
.erro{text-align:center;color:var(--gray-500);padding:40px 20px;font-size:15px}
.titulo-s{font-size:16px;font-weight:800;text-align:center;margin-bottom:12px}
.ops{display:flex;flex-direction:column;gap:10px}
.op{width:100%;text-align:left;background:var(--white);border:2px solid var(--gray-200);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--gray-900)}
.op:hover{border-color:var(--blue)}
.op[disabled]{cursor:wait}
.op-topo{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.selo{background:var(--green);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px}
.op-valor{font-size:22px;font-weight:800;margin-top:4px}
.op-sub{font-size:12px;color:var(--gray-500);margin-top:2px}
.msg-erro{color:#B91C1C;font-size:13px;text-align:center;margin-top:10px}
.trocar{display:block;width:100%;margin-top:14px;background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.cron{margin-top:14px;border-top:1px solid var(--gray-100);padding-top:8px}
.cron-l{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--gray-500)}
.cron-l.ok{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logos">
    <img src="/assets/logo.png" alt="For School">
    <img src="/assets/logo-playup.png" alt="Play Up Fotografia">
  </div>

  <div id="conteudo">
    <div class="erro">Carregando…</div>
  </div>
</div>

<script type="module">
// O rewrite do Vercel (/pagar/:token -> /app/pagamento.html?token=:token) so'
// existe internamente — o navegador nunca ve essa query string na barra de
// endereco, ela continua mostrando /pagar/<token>. Por isso o token precisa
// vir do proprio caminho da URL, nao de location.search (que fica vazio).
const tokenDoPath = (location.pathname.match(/\/pagar\/([^/]+)/) || [])[1];
const token = tokenDoPath || new URLSearchParams(location.search).get('token');
const el = document.getElementById('conteudo');

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtMoney(v) {
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
}

// ---------------------------------------------------------------------------
// Carrega o pedido e as formas de pagamento do SERVIDOR (/api/pedido-publico):
// quem decide o que existe (cartao a vista e parcelado, com as taxas do
// projeto) e quanto custa e' o servidor. Esta pagina so' desenha e chama
// /api/criar-cobranca autorizada pelo token do link: PIX automatico (Woovi) e
// cartao a vista/parcelado — as mesmas formas do portal. Sem PIX manual e sem
// PIX parcelado aqui (o parcelado so' existe no portal).
// ---------------------------------------------------------------------------
let dados = null;          // ultima resposta de /api/pedido-publico
let verOpcoes = false;     // true = o pai clicou em "escolher outra forma"
let vigia = null;
function pararVigia() { if (vigia) { clearInterval(vigia); vigia = null; } }

async function carregar() {
  const r = await fetch('/api/pedido-publico', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token }),
  });
  const json = await r.json().catch(() => ({}));
  if (!r.ok || !json.ok) throw new Error(json.erro || 'Pedido nao encontrado.');
  return json;
}

async function iniciar() {
  if (!token) {
    el.innerHTML = '<div class="erro">Link inválido.</div>';
    return;
  }
  try {
    dados = await carregar();
  } catch (e) {
    el.innerHTML = '<div class="erro">Não encontramos esse pedido. Confira se o link está completo, ou fale com a Play Up.</div>';
    return;
  }
  render();
}

function cabecalho(p) {
  const itens = (p.itens || []).map(i =>
    `${i.quantidade > 1 ? i.quantidade + '× ' : ''}${escapeHtml(i.nome)}${i.variante ? ` (${escapeHtml(i.variante)})` : ''}`
  );
  return `
    <div class="card">
      <div class="titulo">Pedido ${escapeHtml(p.order_number || '')}</div>
      <div class="sub">${escapeHtml(p.school_name || '')}${p.project_name ? ' · ' + escapeHtml(p.project_name) : ''}</div>
      <div class="linha"><span>Aluno</span><b>${escapeHtml(p.student_name || '')}</b></div>
      <div class="linha"><span>Turma</span><b>${escapeHtml(p.turma || '—')}</b></div>
      <div class="linha"><span>Itens</span><b class="itens-lista">${itens.join('<br>') || '—'}</b></div>
      <div class="valor-box">
        <div class="rotulo">Valor do pedido</div>
        <div class="num">${fmtMoney(p.total_amount)}</div>
      </div>
    </div>`;
}

const RODAPE = (p) => `
  <a class="duvida" href="https://wa.me/5511999363796?text=${encodeURIComponent('Olá! Tenho uma dúvida sobre o pagamento do pedido ' + (p.order_number || '') + '.')}" target="_blank">💬 Dúvidas? Fale com a Play Up</a>`;

function fmtData(iso) {
  const [y, m, d] = String(iso).slice(0, 10).split('-');
  return `${d}/${m}/${y}`;
}

function render() {
  pararVigia();
  const p = dados.pedido;

  if (dados.pago) {
    el.innerHTML = cabecalho(p) + `
      <div class="pago-box">✓ Pagamento confirmado<br><span style="font-weight:400;font-size:13px">Obrigada pelo pedido! 💛</span></div>` + RODAPE(p);
    return;
  }
  if (dados.cancelado) {
    el.innerHTML = cabecalho(p) + `<div class="erro">Este pedido foi cancelado. Fale com a Play Up se precisar de ajuda.</div>` + RODAPE(p);
    return;
  }
  if (dados.cobranca && !verOpcoes) { renderCobranca(); return; }
  renderOpcoes();
}

// ---------------------------------------------------------------------------
// Escolha da forma de pagamento
// ---------------------------------------------------------------------------
function renderOpcoes() {
  const p = dados.pedido, o = dados.opcoes;
  const botoes = [];

  if (o.pix_auto) botoes.push(`
    <button class="op" data-acao="pix">
      <div class="op-topo"><b>💚 PIX</b><span class="selo">MAIS BARATO</span></div>
      <div class="op-valor">${fmtMoney(o.pix_auto.valor)}</div>
      <div class="op-sub">Aprovação na hora, sem acréscimo</div>
    </button>`);

  (o.credito || []).forEach(c => botoes.push(`
    <button class="op" data-acao="credito" data-n="${c.n}">
      <div class="op-topo"><b>💳 ${c.n === 1 ? 'Cartão à vista' : 'Cartão em ' + c.n + '×'}</b></div>
      <div class="op-valor">${c.n === 1 ? fmtMoney(c.total) : c.n + '× de ' + fmtMoney(c.parcela)}</div>
      <div class="op-sub">${c.n === 1 ? 'Pagamento em página segura' : 'Total ' + fmtMoney(c.total) + ' · página segura'}</div>
    </button>`));

  const semNada = !botoes.length;
  el.innerHTML = cabecalho(p) + `
    ${botoes.length ? `<div class="card"><div class="titulo-s">Como você prefere pagar?</div><div class="ops">${botoes.join('')}</div><div id="msg-erro" class="msg-erro"></div></div>` : ''}
    ${semNada ? `<div class="card erro" style="padding:24px">${dados.sem_cpf ? 'Faltam dados do responsável para gerar o pagamento.' : 'Nenhuma forma de pagamento disponível agora.'}<br>Fale com a Play Up pelo botão abaixo.</div>` : ''}
  ` + RODAPE(p);

  el.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => escolher(b)));

}

async function escolher(btn) {
  const acao = btn.dataset.acao;
  const n = parseInt(btn.dataset.n, 10) || 1;
  const caixa = document.getElementById('msg-erro');
  caixa.textContent = '';
  el.querySelectorAll('.op').forEach(b => { b.disabled = true; b.style.opacity = '.55'; });
  btn.querySelector('.op-sub').textContent = 'Gerando… aguarde';
  try {
    const corpo = { order_id: dados.pedido.order_id, payment_link_token: token, method: acao === 'pix' ? 'pix' : 'credito', installments: acao === 'pix' ? 1 : n };
    const resp = await fetch('/api/criar-cobranca', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const json = await resp.json().catch(() => ({}));
    if (!resp.ok || json.ok === false) throw new Error(json.erro || 'Não foi possível gerar o pagamento.');
    if (acao === 'credito') {
      if (!json.checkout_url) throw new Error('Não recebemos o link de pagamento.');
      location.href = json.checkout_url;
      return;
    }
    dados = await carregar();     // pega o QR gravado no pedido
    verOpcoes = false;
    render();
  } catch (err) {
    const msg = err.message || 'Erro ao gerar o pagamento. Tente de novo em instantes.';
    renderOpcoes();                                   // volta os botoes ao normal
    document.getElementById('msg-erro').textContent = msg;
  }
}

// ---------------------------------------------------------------------------
// Cobranca ja gerada (PIX automatico, parcela do PIX parcelado ou cartao)
// ---------------------------------------------------------------------------
function renderCobranca() {
  const p = dados.pedido, c = dados.cobranca;
  const ehPix = !!(c.pix_payload || c.pix_qr_image);
  const miolo = ehPix ? `
      <div class="titulo-s">Pague com PIX</div>
      <div class="valor-box" style="margin:6px 0 4px"><div class="num" style="font-size:28px">${fmtMoney(c.valor)}</div></div>
      <div class="qr-wrap">${c.pix_qr_image ? `<img src="${escapeHtml(c.pix_qr_image)}" alt="QR Code Pix" width="220" height="220" style="border-radius:10px;border:1px solid var(--gray-200)">` : '<canvas id="qr-pix" width="220" height="220"></canvas>'}</div>
      ${c.pix_payload ? `<div class="copia-box">${escapeHtml(c.pix_payload)}</div><button class="btn btn-copiar" id="btn-copiar-pix">📋 Copiar código Pix</button>` : ''}
      <div class="nome-titular">Abra o app do seu banco, escolha Pix e aponte a câmera pro QR, ou use "Pix Copia e Cola".<br>Esta tela avisa sozinha quando o pagamento for confirmado.</div>`
    : `
      <div class="titulo-s">Pagamento no cartão${c.parcelas > 1 ? ' em ' + c.parcelas + '×' : ''}</div>
      <div class="valor-box" style="margin:6px 0 10px"><div class="num" style="font-size:28px">${fmtMoney(c.valor)}</div></div>
      <a class="btn btn-cartao" href="${escapeHtml(c.checkout_url)}">💳 Ir para o pagamento seguro</a>
      <div class="nome-titular">Você será levado(a) a uma página segura de pagamento (Asaas) — seus dados do cartão não passam pelo nosso site.</div>`;

  el.innerHTML = cabecalho(p) + `
    <div class="card">${miolo}
      <button type="button" class="trocar" id="btn-trocar">↩ Escolher outra forma de pagamento</button>
    </div>` + RODAPE(p);

  document.getElementById('btn-trocar').addEventListener('click', () => { pararVigia(); verOpcoes = true; render(); });

  if (ehPix && !c.pix_qr_image && c.pix_payload) {
    QRCode.toCanvas(document.getElementById('qr-pix'), c.pix_payload, { width: 220, margin: 1 }, err => { if (err) console.error(err); });
  }
  const cp = document.getElementById('btn-copiar-pix');
  if (cp) cp.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(c.pix_payload);
      cp.textContent = '✓ Copiado!';
      setTimeout(() => { cp.textContent = '📋 Copiar código Pix'; }, 2000);
    } catch { alert('Não consegui copiar automaticamente — selecione o código acima manualmente.'); }
  });

  // Confere o pagamento a cada 5s (mesmo ritmo do portal) e troca pela confirmacao
  // quando cair. So' PIX: o cartao leva o pai pra fora da pagina.
  pararVigia();
  if (ehPix) {
    vigia = setInterval(async () => {
      try {
        const novo = await carregar();
        if (novo.pago) { dados = novo; render(); }
      } catch { /* tenta de novo no proximo ciclo */ }
    }, 5000);
  }
}

iniciar();
</script>
</body>
</html>
